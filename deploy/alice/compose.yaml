# Alice deployment of AIRI (Plan 05). Run from the root of the repository:
#
#   deploy/alice/scripts/preparar.sh
#   docker compose -f deploy/alice/compose.yaml up -d --build
#
# Profile `broker`: a test Mosquitto, only for a machine without the NeoAlice broker.
#   docker compose -f deploy/alice/compose.yaml --profile broker up -d --build
#
# Profile `bridge`: a read-only copy of the NeoAlice broker with a WebSocket listener, for a
# NeoAlice broker that has no WebSocket listener. Set NEOALICE_MQTT_HOST in .env.
#   docker compose -f deploy/alice/compose.yaml --profile bridge up -d --build
#
# The TalkingHead server (port 8081) and the NeoAlice services do not change.

name: alice-airi

services:
  airi-web:
    build:
      context: ../..
      dockerfile: deploy/alice/docker/Dockerfile
      target: web
    image: alice/airi-web:local
    restart: unless-stopped
    ports:
      # All addresses of the host, so any IP of the machine opens the app.
      - ${AIRI_HTTP_PORT:-4173}:80
      - ${AIRI_HTTPS_PORT:-4443}:443
    environment:
      AIRI_MQTT_WS_UPSTREAM: ${AIRI_MQTT_WS_UPSTREAM:-host.docker.internal:9001}
      AIRI_TALKINGHEAD_UPSTREAM: ${AIRI_TALKINGHEAD_UPSTREAM:-}
      AIRI_LLM_UPSTREAM: ${AIRI_LLM_UPSTREAM:-http://host.docker.internal:11434}
      AIRI_TTS_UPSTREAM: ${AIRI_TTS_UPSTREAM:-http://host.docker.internal:8880}
      AIRI_STT_UPSTREAM: ${AIRI_STT_UPSTREAM:-http://host.docker.internal:9100}
      AIRI_STT_TRANSCRIBE_PATH: ${AIRI_STT_TRANSCRIBE_PATH:-/v1/audio/transcriptions}
      NEOALICE_API_UPSTREAM: ${NEOALICE_API_UPSTREAM:-http://host.docker.internal:8080}
      # Keys stay in the proxy configuration of the container. The browser never gets them.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NEOALICE_API_KEY: ${NEOALICE_API_KEY:-}
      # First settings of AIRI, in /airi-defaults.json. Settings saved in the browser stay.
      AIRI_DEFAULT_CHAT_PROVIDER: ${AIRI_DEFAULT_CHAT_PROVIDER:-ollama}
      AIRI_DEFAULT_CHAT_MODEL: ${AIRI_DEFAULT_CHAT_MODEL:-}
      AIRI_DEFAULT_TTS_MODEL: ${AIRI_DEFAULT_TTS_MODEL:-kokoro}
      AIRI_DEFAULT_TTS_VOICE: ${AIRI_DEFAULT_TTS_VOICE:-}
      AIRI_DEFAULT_STT_MODEL: ${AIRI_DEFAULT_STT_MODEL:-whisper-1}
      AIRI_DEFAULT_NEOALICE_SITE: ${AIRI_DEFAULT_NEOALICE_SITE:-}
      AIRI_DEFAULT_NEOALICE_ENABLED: ${AIRI_DEFAULT_NEOALICE_ENABLED:-false}
      AIRI_DEFAULT_NEOALICE_SPEECH_MODE: ${AIRI_DEFAULT_NEOALICE_SPEECH_MODE:-silent}
      AIRI_DEFAULT_NEOALICE_VOICE_INPUT: ${AIRI_DEFAULT_NEOALICE_VOICE_INPUT:-false}
      AIRI_DEFAULT_NEOALICE_USER_ID: ${AIRI_DEFAULT_NEOALICE_USER_ID:-}
      AIRI_DEFAULT_NEOALICE_WAKE_WORD: ${AIRI_DEFAULT_NEOALICE_WAKE_WORD:-}
      AIRI_DEFAULT_NEOALICE_ANNOUNCE_STATE: ${AIRI_DEFAULT_NEOALICE_ANNOUNCE_STATE:-false}
      AIRI_DEFAULT_NEOALICE_BRAIN: ${AIRI_DEFAULT_NEOALICE_BRAIN:-false}
      AIRI_DEFAULT_NEOALICE_MOOD_SITE: ${AIRI_DEFAULT_NEOALICE_MOOD_SITE:-magicmirror}
      AIRI_DEFAULT_NEOALICE_MIRROR_SPEECH: ${AIRI_DEFAULT_NEOALICE_MIRROR_SPEECH:-true}
      # Origins that can call the proxies from another origin. "null" is the desktop app (file://).
      AIRI_CORS_ORIGINS: ${AIRI_CORS_ORIGINS-null,file://}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      # Certificates of scripts/preparar.sh. Without them, airi-web serves HTTP only.
      - ./tls:/etc/airi/tls:ro
      - ./modelos:/usr/share/nginx/models:ro
      # FBX and VRMA motions. AIRI lists them in the motion library, without an import.
      - ./animacoes:/usr/share/nginx/animations:ro

  alice-companion:
    build:
      context: ../..
      dockerfile: deploy/alice/docker/Dockerfile
      target: companion
    image: alice/alice-companion:local
    restart: unless-stopped
    init: true
    # One instance per data volume: two would split the authority of the state.
    deploy:
      replicas: 1
    environment:
      ALICE_COMPANION_MQTT_URL: ${ALICE_COMPANION_MQTT_URL:-mqtt://host.docker.internal:1883}
      ALICE_COMPANION_MQTT_USERNAME: ${ALICE_COMPANION_MQTT_USERNAME:-}
      ALICE_COMPANION_MQTT_PASSWORD: ${ALICE_COMPANION_MQTT_PASSWORD:-}
      ALICE_COMPANION_INPUT_SITES: ${ALICE_COMPANION_INPUT_SITES:-}
      ALICE_COMPANION_PUBLISH_SITE: ${ALICE_COMPANION_PUBLISH_SITE:-companion}
      ALICE_COMPANION_PERSONA_ID: ${ALICE_COMPANION_PERSONA_ID:-alice}
      ALICE_COMPANION_OWNER_PROFILE_ID: ${ALICE_COMPANION_OWNER_PROFILE_ID:-default}
      ALICE_COMPANION_TIME_ZONE: ${ALICE_COMPANION_TIME_ZONE:-America/Sao_Paulo}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - alice-companion-data:/data

  # Converts the Eva GLB to VRM. scripts/preparar.sh runs it once, when modelos/ has no VRM.
  eva-convert:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: deploy/alice/docker/Dockerfile
      target: tools
    image: alice/airi-tools:local
    volumes:
      - ./modelos:/modelos

  mosquitto:
    profiles: [broker]
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Anonymous test broker: only this machine reaches it directly. Browsers use /mqtt of airi-web.
      - 127.0.0.1:${TEST_MQTT_PORT:-11883}:1883
      - 127.0.0.1:${TEST_MQTT_WS_PORT:-19001}:9001
    volumes:
      - ./mqtt-test/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Read-only copy of the NeoAlice topics, with the WebSocket listener that the browser needs.
  # With it, set AIRI_MQTT_WS_UPSTREAM=mqtt-bridge:9001 in .env.
  mqtt-bridge:
    profiles: [bridge]
    image: eclipse-mosquitto:2
    # A configuration error, for example an empty NEOALICE_MQTT_HOST, stops the bridge after 3 tries.
    restart: on-failure:3
    entrypoint: [/bin/sh, /bridge/start.sh]
    environment:
      NEOALICE_MQTT_HOST: ${NEOALICE_MQTT_HOST:-}
      NEOALICE_MQTT_PORT: ${NEOALICE_MQTT_PORT:-1883}
      NEOALICE_MQTT_USERNAME: ${NEOALICE_MQTT_USERNAME:-}
      NEOALICE_MQTT_PASSWORD: ${NEOALICE_MQTT_PASSWORD:-}
      NEOALICE_MQTT_TOPICS: ${NEOALICE_MQTT_TOPICS:-neoalice/#}
    volumes:
      - ./mqtt-bridge/start.sh:/bridge/start.sh:ro

volumes:
  alice-companion-data:
